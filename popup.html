<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Altwiki</title>
  <style>
    :root { color-scheme: light dark; --line: #8884; --accent: #1f8a9e; }
    body { margin: 0; width: 280px; padding: 14px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 10px; }
    .muted { opacity: .7; font-size: 12.5px; }
    button { width: 100%; margin-top: 10px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    details { margin-top: 10px; font-size: 12.5px; }
    summary { cursor: pointer; opacity: .8; }
    #events { list-style: none; margin: 6px 0 0; padding: 0; max-height: 220px; overflow: auto; }
    #events li { padding: 4px 0; border-top: 1px solid var(--line); word-break: break-word; }
    #events span { opacity: .65; display: block; }
    .switch { position: relative; display: inline-flex; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .slider { width: 36px; height: 20px; border-radius: 999px; background: #9ca3af88; position: relative; transition: background .15s; }
    .slider::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px #0004; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::after { transform: translateX(16px); }
  </style>
</head>
<body>
  <h1><img src="icons/icon-32.png" width="22" height="22" alt="" style="vertical-align:-4px;margin-right:6px">Altwiki</h1>
  <div class="row"><span>Redirect on</span><label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label></div>
  <div class="row muted"><span id="summary"></span></div>
  <button id="options" type="button">Choose wiki</button>
  <details id="why"><summary>What happened on the last pages</summary><ul id="events"></ul></details>
  <button id="debug" type="button">Copy debug info</button>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
